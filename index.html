<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Asistente Personal IA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
.header{padding:12px;text-align:center;background:#1e293b;border-bottom:1px solid #334155}
.p-btn{padding:6px 12px;border-radius:20px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;margin:2px;font-size:12px}
.p-btn.active{background:#0ea5e9;color:#fff}
.modes{padding:8px;background:#1e293b;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.m-btn{padding:10px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#cbd5e1;cursor:pointer;font-size:12px;font-weight:600}
.m-btn.active{background:#22d3ee;color:#0f172a}
.chat{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.msg{padding:10px 12px;border-radius:14px;max-width:92%;font-size:14px;line-height:1.4}
.bot{background:#1e293b;align-self:flex-start;border:1px solid #334155}
.user{background:#2563eb;align-self:flex-end;color:#fff}
.input-area{padding:10px;background:#1e293b;display:flex;gap:6px;border-top:1px solid #334155;align-items:center}
.input-area input{flex:1;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;outline:none}
.btn-icon{border:none;padding:12px;border-radius:10px;cursor:pointer;font-size:18px}
.btn-mic{background:#334155}.btn-mic.on{background:#ef4444}
.btn-voice{background:#334155}.btn-voice.on{background:#22c55e}
.btn-send{background:#22c55e;padding:12px 16px;font-weight:800;border:none;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<h3>🧠 Mi Asistente Personal IA</h3>
<div style="margin-top:8px">
<button class="p-btn active" onclick="setP('Adriana',this)">Adriana</button>
<button class="p-btn" onclick="setP('Adrián',this)">Adrián</button>
<button class="p-btn" onclick="setP('Familia',this)">Familia</button>
<button class="p-btn" onclick="setP('Pablo',this)">Pablo</button>
</div>
</div>
<div class="modes">
<button class="m-btn" id="btn-conversar" onclick="setM('Conversar')">💬 Conversar</button>
<button class="m-btn" id="btn-ansiedad" onclick="setM('Ansiedad')">🌿 Ansiedad</button>
<button class="m-btn" id="btn-toc" onclick="setM('TOC')">🧠 TOC</button>
<button class="m-btn active" id="btn-familia" onclick="setM('Familia')">❤️ Familia</button>
</div>
<div class="chat" id="chat">
<div class="msg bot">Hola! Soy tu asistente con voz 🔊 y micro 🎤<br>Activa el parlante 🔈 para que me escuches.</div>
</div>
<div class="input-area">
<button class="btn-icon btn-mic" id="mic" onclick="toggleMic()">🎤</button>
<button class="btn-icon btn-voice" id="voice" onclick="toggleVoice()">🔈</button>
<input id="inp" placeholder="Escribe o habla..." onkeydown="if(event.key==='Enter')send()">
<button class="btn-send" onclick="send()">Enviar</button>
</div>
<script>
let perfil='Adriana',modo='Familia',rec,listening=false,voiceOn=true;
function setP(p,el){perfil=p;document.querySelectorAll('.p-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function setM(m){modo=m;document.querySelectorAll('.m-btn').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+m.toLowerCase()).classList.add('active');}
function add(t,c){const ch=document.getElementById('chat');const d=document.createElement('div');d.className='msg '+c;d.innerHTML=t;ch.appendChild(d);ch.scrollTop=ch.scrollHeight;if(c==='bot'&&voiceOn)speak(t.replace(/<[^>]*>/g,''));}
function getR(x){const l=x.toLowerCase();if(l.includes('toc'))return 'TOC: Es el cerebro dando falsa alarma. No eres tus pensamientos. Di: esto es TOC, no lo discuto.';if(l.includes('ansiedad'))return 'Ansiedad: Respira 4 segundos inhala, 2 sostén, 6 exhala. Hazlo 4 veces.';return 'Te escucho '+perfil+'. Modo '+modo+'. Cuéntame más.';}
function send(){const i=document.getElementById('inp');const v=i.value.trim();if(!v)return;add(v,'user');i.value='';setTimeout(()=>add(getR(v),'bot'),400);}
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-MX';u.rate=1;speechSynthesis.speak(u);}
function toggleVoice(){voiceOn=!voiceOn;const b=document.getElementById('voice');b.textContent=voiceOn?'🔊':'🔇';b.classList.toggle('on',voiceOn);if(voiceOn)speak('Voz activada');else speechSynthesis.cancel();}
function toggleMic(){
 if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){alert('Usa Chrome');return;}
 if(!rec){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;rec=new SR();rec.lang='es-MX';rec.onresult=e=>{document.getElementById('inp').value=e.results[0][0].transcript;send();};rec.onend=()=>{listening=false;document.getElementById('mic').classList.remove('on');};}
 if(!listening){rec.start();listening=true;document.getElementById('mic').classList.add('on');}else rec.stop();
}
document.getElementById('voice').classList.add('on');
</script>
</body>
</html>
