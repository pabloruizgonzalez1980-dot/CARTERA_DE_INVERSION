<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Asistente Personal IA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
.header{padding:16px;text-align:center;background:#1e293b;border-bottom:1px solid #334155}
.p-btn{padding:7px 14px;border-radius:20px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;margin:2px;font-size:13px}
.p-btn.active{background:#0ea5e9;color:#fff}
.modes{padding:10px;background:#1e293b;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m-btn{padding:12px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#cbd5e1;cursor:pointer;font-weight:600;font-size:13px}
.m-btn.active{background:#22d3ee;color:#0f172a}
.chat{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.msg{padding:10px 14px;border-radius:16px;max-width:90%;font-size:14px;line-height:1.5;white-space:pre-wrap}
.bot{background:#1e293b;align-self:flex-start;border:1px solid #334155}
.user{background:#2563eb;align-self:flex-end;color:#fff}
.system{background:#334155;align-self:center;font-size:11px;padding:5px 10px;border-radius:20px}
.input-area{padding:10px;background:#1e293b;display:flex;gap:6px;border-top:1px solid #334155}
.input-area input{flex:1;padding:12px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff;outline:none}
.btn-mic{background:#334155;border:none;padding:12px 14px;border-radius:12px;cursor:pointer;font-size:18px}
.btn-mic.listening{background:#ef4444;animation:pulse 1s infinite}
.btn-send{background:#22c55e;border:none;padding:12px 16px;border-radius:12px;font-weight:800;cursor:pointer}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="header">
<h1>🧠 Mi Asistente Personal IA</h1>
<div style="margin-top:10px">
<button class="p-btn active" onclick="setProfile('Adriana',this)">Adriana</button>
<button class="p-btn" onclick="setProfile('Adrián',this)">Adrián</button>
<button class="p-btn" onclick="setProfile('Familia',this)">Familia</button>
<button class="p-btn" onclick="setProfile('Pablo',this)">Pablo</button>
</div>
</div>
<div class="modes">
<button class="m-btn" id="btn-conversar" onclick="setMode('Conversar')">💬 Conversar</button>
<button class="m-btn" id="btn-ansiedad" onclick="setMode('Ansiedad')">🌿 Ansiedad</button>
<button class="m-btn" id="btn-toc" onclick="setMode('TOC')">🧠 TOC</button>
<button class="m-btn active" id="btn-familia" onclick="setMode('Familia')">❤️ Familia</button>
</div>
<div class="chat" id="chat">
<div class="msg bot">Hola! Perfil: <b id="perfil-txt">Adriana</b> | Modo: <b id="modo-txt">Familia</b>

Funciona en PC y teléfono. Con botón 🎤 de micrófono.

Prueba escribir "Que es el TOC"</div>
</div>
<div class="input-area">
<button class="btn-mic" id="micBtn" onclick="toggleMic()">🎤</button>
<input id="inputMsg" placeholder="Escribe o habla..." onkeydown="if(event.key==='Enter')sendMsg()">
<button class="btn-send" onclick="sendMsg()">Enviar</button>
</div>
<script>
let perfil='Adriana', modo='Familia', recognition, isListening=false;
function setProfile(p,el){perfil=p;document.querySelectorAll('.p-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('perfil-txt').innerText=p;}
function setMode(m){modo=m;document.querySelectorAll('.m-btn').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+m.toLowerCase()).classList.add('active');document.getElementById('modo-txt').innerText=m;}
function addMsg(text,cls){const c=document.getElementById('chat');const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=text;c.appendChild(d);c.scrollTop=c.scrollHeight;}
function getResp(t){t=t.toLowerCase();if(t.includes('toc'))return '🧠 <b>TOC:</b> Obsesiones + compulsiones. No es tu culpa. Técnica: Nombra "es TOC", no discutas, retrasa 5 min.';if(t.includes('ansiedad'))return '🌿 <b>Ansiedad:</b> Respira 4-2-6 x4. Técnica 5-4-3-2-1. Agua fría en manos.';if(t.includes('familia'))return '❤️ <b>Familia:</b> Usa "Me siento... cuando... necesito..."';return 'Gracias '+perfil+' ('+modo+'): "'+t+'"<br>Te escucho sin juzgar. ¿Quieres herramienta práctica?';}
function sendMsg(){const i=document.getElementById('inputMsg');const v=i.value.trim();if(!v)return;addMsg(v,'user');i.value='';setTimeout(()=>addMsg(getResp(v),'bot'),400);}
function toggleMic(){
 const btn=document.getElementById('micBtn');
 if(!('webkitSpeechRecognition' in window) &&!('SpeechRecognition' in window)){alert('Usa Chrome para micrófono');return;}
 if(!recognition){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();recognition.lang='es-MX';recognition.interimResults=false;
  recognition.onresult=(e)=>{document.getElementById('inputMsg').value=e.results[0][0].transcript;sendMsg();};
  recognition.onend=()=>{isListening=false;btn.classList.remove('listening');btn.innerText='🎤';};
  recognition.onerror=()=>{isListening=false;btn.classList.remove('listening');};
 }
 if(!isListening){recognition.start();isListening=true;btn.classList.add('listening');btn.innerText='🔴';}else{recognition.stop();}
}
</script>
</body>
</html>
